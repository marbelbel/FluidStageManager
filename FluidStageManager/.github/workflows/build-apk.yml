name: Build Fluid Stage Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static verification
        run: python scripts/verify_project.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace --console=plain

      - name: Calculate APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK and license notices
        uses: actions/upload-artifact@v4
        with:
          name: FluidStageManager-0.5.1-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            LICENSE
            LICENSE-APACHE-2.0.txt
            THIRD-PARTY-NOTICES.md
            PRIVACIDAD.md
          if-no-files-found: error
